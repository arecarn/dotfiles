---
name: CI

# "*" does not match "/", so it silently skips branches like "deps/foo" --
# no run, no failure. "**" matches slashes.
on:  # yamllint disable-line rule:truthy
  push:
    branches: "**"
  pull_request:
    branches: "**"

# A new push cancels the run in flight for the same branch, so only the latest
# commit is tested. The PR number keys the group when present, so a branch's
# push run and pull_request run do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    env:
      COREHOST_ALLOW_SYMLINKS: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Remove pre-installed Node.js (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        run: choco install shellcheck
      - name: Enable symbolic links (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" ^
            /t REG_DWORD /v "AllowDevelopmentWithoutDevLicense" /d 1 /f
          git config --global core.symlinks true
      - name: Install dependencies
        run: uv sync
      - name: Provision (headless)
        # Lets ansible's GitHub API calls use the per-token rate limit rather
        # than the runner IP's shared anonymous quota.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run invoke provision --args="-v"
      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Lint
        run: uv run invoke lint
      - name: Test
        run: uv run invoke test
      # git config --global (above) creates ~/.gitconfig which conflicts
      # with dploy stowing git/.gitconfig to the same path
      - name: Clean conflicting dotfiles before stow (Windows)
        if: runner.os == 'Windows'
        run: |
          Remove-Item ~\.gitconfig -ErrorAction SilentlyContinue
          Remove-Item ~\.gitconfig_personal -ErrorAction SilentlyContinue
          if (Test-Path ~\.ssh) {
            Remove-Item ~\.ssh\* -ErrorAction SilentlyContinue
          }
          if (Test-Path ~\.config\git) {
            Remove-Item ~\.config\git -Recurse -ErrorAction SilentlyContinue
          }
      - name: Stow (test)
        run: uv run invoke stow

---
# Maps each generated instruction file to its ordered fragments.
#
# Identical fragment lists across harnesses are expected and correct: fragments
# contain no harness-specific syntax, so every harness gets the same content.
# When one harness genuinely needs more, give it an extra fragment here rather
# than forking a shared document.
outputs:
  # Global instructions, symlinked into $HOME by the claude-code stow package.
  claude-code/.claude/CLAUDE.md:
    fragments:
      - build-ci
      - comments
      - merge-requests
      - output-formatting
      - python
      - review-before-posting
      - teams
      - local-pointer
  # Claude Code gets prose-style as an output style instead, so selecting it
  # replaces Claude's own brevity instructions rather than arguing with them
  # from context. Selected by `_setup_claude_settings` in tasks.py. The header
  # is here because an output style reserves the first line for frontmatter.
  claude-code/.claude/output-styles/concise.md:
    header: |
      ---
      name: Concise
      description: Concise, direct prose that expands when needed; structured when it aids reading; no filler, no AI-tell punctuation
      ---
    fragments:
      - prose-style
  # Global instructions, symlinked into $HOME by the pi stow package.
  pi/.pi/agent/AGENTS.md:
    fragments:
      - build-ci
      - comments
      - merge-requests
      - output-formatting
      - prose-style
      - python
      - review-before-posting
      - teams
      - local-pointer
  # This repo's own project instructions, read in place.
  CLAUDE.md:
    fragments:
      - project-overview
  AGENTS.md:
    fragments:
      - project-overview

# Plugin/MCP manifest for AI coding agents.
#
# Plugin defaults (when only `repo` + `plugin` are specified):
#   claude:   claude plugin marketplace add {repo}
#             claude plugin install {plugin}
#   opencode: npx --yes skills add {repo} --agent opencode --global --yes
#
# Update defaults:
#   claude:   claude plugin marketplace update {marketplace}
#             claude plugin update {plugin}
#   opencode: npx --yes skills update --global
#   pi:       pi update {pi_package}
#
# Override with explicit `install` and/or `update` keys per tool.
# Values can be a string (single command) or a list (multiple commands).
# If `update` is omitted, `install` commands are re-run.
#
# pi packages. A `pi_package:` key holds the package's source spec, and
# `inv pi-setup` writes every one of them into ~/.pi/agent/settings.json, which
# pi owns and also writes its own preferences into. `inv pi-install-plugins`
# then runs `pi update --extensions` to reconcile disk state against that file.
# Declaring here rather than in settings.json is what lets plugins_local.yaml
# add a work-specific pi package.
#   pi_package: git:github.com/user/repo | npm:pkg | npm:pkg@1.2.3
#
# MCP servers. `inv install-mcp` writes each entry below into every harness's own
# MCP config file — ~/.claude.json for Claude Code, ~/.agents/mcp.json for pi — so
# a server is declared here once and no harness drifts from another. Entries
# already present in a harness's file are left alone; redefining a server means
# editing it there. Work-specific servers are declared the same way in
# plugins_local.yaml, which a dotfiles_local repo supplies.
#   mcp:
#     type: http | sse | stdio
#     url: https://...          # for http/sse
#     command: npx              # for stdio
#     args: [...]               # for stdio
#     headers: {TOKEN: "${ENV_VAR}"}   # ${VAR} is expanded by both harnesses

# Ships in the built-in official marketplace, so there is no marketplace to add
# and no opencode equivalent to install.
mattpocock-skills:
  install:
    claude: claude plugin install mattpocock-skills@claude-plugins-official
  update:
    claude: claude plugin update mattpocock-skills@claude-plugins-official

superpowers:
  repo: obra/superpowers
  plugin: superpowers@superpowers-dev
  pi_package: git:github.com/obra/superpowers

# Pi core ships no subagent tool and no MCP support; both are deliberate
# omissions upstream. These fill the gaps superpowers skills expect.
# Third-party, single-maintainer, fast-moving: pi packages run with full
# system access, so review before bumping.
pi-subagents:
  pi_package: npm:pi-subagents

pi-mcp-adapter:
  pi_package: npm:pi-mcp-adapter

# Durable background shell jobs. This intentionally overlaps only the monitor
# package's process-launch surface; it adds retained logs and result retrieval.
pi-background-tasks:
  pi_package: npm:pi-background-tasks

ticktick:
  mcp:
    type: http
    url: https://mcp.ticktick.com/

gmail:
  mcp:
    type: http
    url: https://gmailmcp.googleapis.com/mcp/v1

google-calendar:
  mcp:
    type: http
    url: https://calendarmcp.googleapis.com/mcp/v1

---
# Packages with the same name on both Debian and RedHat
common_system_packages:
  - bat
  - coreutils
  - curl
  - eza
  - fd-find
  - fzf
  - gawk
  - gh
  - git
  - htop
  - ncdu
  - nodejs
  - openssh-server
  - pandoc
  - picocom
  - ripgrep
  - shellcheck
  - tmux
  - tree
  - unzip  # ansible.builtin.unarchive needs it for the .zip release assets
  - wget
  - xclip
  - zoxide
  - zsh

# Packages with different names per OS family
os_family_system_packages:
  Debian:
    - python3
    - python3-dev
    - python3-pip
    - ssh-askpass
    - unrar
  RedHat:
    - python3
    - python3-devel
    - python3-pip
    - openssh-askpass
    - unrar

# Desktop-only packages, skipped on a headless host. On Linux the skip is the
# `desktop-only` tag on the play that installs these; the list itself is
# unconditional here.
desktop_only_system_packages:
  Debian:
    - wezterm
    - firefox
    - vlc
  RedHat:
    - wezterm
    - firefox
    - vlc

# Chocolatey packages for Windows. Read from this file by manage/provision.py
# rather than by Ansible, which never runs on Windows here -- the file is the
# single answer to "what gets installed on a machine" for all three platforms.
windows_system_packages:
  - llvm
  - pandoc
  - git
  # universal-ctags, not ctags: the latter packages Exuberant Ctags 5.8 (2009)
  # from a SourceForge URL that now times out, and ships no checksum, which
  # Chocolatey refuses by default. Universal Ctags is its maintained successor
  # and provides the same `ctags` binary.
  - universal-ctags
  - neovim
  - nodejs
  - plantuml
  - fzf
  - zoxide
  - eza
  - bat
  - delta
  - gsudo
  - ripgrep
  # oh-my-posh carries git status in the prompt. posh-git is deliberately absent:
  # Chocolatey's poshgit v0.7.3.1 hangs inside its own chocolateyInstall.ps1
  # after extracting, burning Chocolatey's full 2700s timeout on every run that
  # reaches it (measured: a 7m Windows CI job became 50m). profile.ps1 imports
  # posh-git only if the module is present, so its absence is silent. Install it
  # from the PowerShell Gallery (`Install-Module posh-git`) if it is wanted back;
  # the Gallery is its canonical source and the Chocolatey wrapper is what hangs.
  - oh-my-posh
  - stylua
  - selene
  - claude-code
  - opencode

# Added to windows_system_packages except on a headless host.
windows_desktop_only_system_packages:
  - nerd-fonts-dejavusansmono
  - vcxsrv
  - anki
  - wezterm

# Nerd Fonts to install (downloaded from GitHub releases)
nerd_fonts:
  - DejaVuSansMono

# Python tools (installed via uv)
python_packages:
  - cmake
  - cmakelint
  - proselint
  - pylint

# JavaScript tools (installed via pnpm)
# claude-code is deliberately not here: its postinstall (downloads a
# platform-native binary) unreliably no-ops under pnpm's content-addressable
# store even with enable-pre-post-scripts on — installed via plain npm instead.
javascript_packages:
  - "@bitwarden/cli"
  - opencode-ai
  - write-good

# Installed with pnpm but with scripts disabled, per pi.dev's documented
# install (`pnpm add -g --ignore-scripts`). Kept separate from
# javascript_packages, whose loop forces scripts on for claude-code's sake.
javascript_packages_no_scripts:
  - "@earendil-works/pi-coding-agent"

# Where global npm packages install, relative to the user's home. Held as a
# subpath rather than a full path because its two readers need different bases:
# npm-config.yml writes `${HOME}/...` into ~/.npmrc, which npm itself expands,
# while npm-packages.yml sets NPM_CONFIG_PREFIX, an environment variable that
# nothing expands and so needs the resolved path.
npm_prefix_subpath: ".local"

npm_global_packages:
  - "@anthropic-ai/claude-code"

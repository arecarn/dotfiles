---
- name: Configure workstation
  hosts: localhost
  connection: local
  become: "{{ not is_termux }}"
  gather_facts: false
  vars:
    user_home: "{{ lookup('env', 'HOME') }}"
    is_termux: "{{ 'com.termux' in lookup('env', 'PREFIX') }}"
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      become: false


  tasks:
    - ansible.builtin.import_tasks: tasks/repos.yml
    - ansible.builtin.import_tasks: tasks/system-packages.yml
    # Every task here masks a unit that only runs on a GNOME desktop.
    - ansible.builtin.import_tasks: tasks/os-baseline.yml
      tags:
        - os-baseline
        - desktop-only
    - ansible.builtin.import_tasks: tasks/lua-language-server.yml
      tags:
        - lua-ls
    - ansible.builtin.import_tasks: tasks/neovim.yml
    - ansible.builtin.import_tasks: tasks/python-packages.yml
    - ansible.builtin.import_tasks: tasks/javascript-packages.yml
    - ansible.builtin.import_tasks: tasks/npm-packages.yml
    - ansible.builtin.import_tasks: tasks/rust-packages.yml
    - ansible.builtin.import_tasks: tasks/direnv.yml
    - ansible.builtin.import_tasks: tasks/nerd-fonts.yml
    - ansible.builtin.import_tasks: tasks/zsh.yml
    # A GNOME desktop entry for an application headless hosts never install.
    - ansible.builtin.import_tasks: tasks/wezterm.yml
      tags:
        - wezterm
        - desktop-only

---
# Not packaged anywhere, so install the upstream release binary directly, same
# approach as lua-language-server.yml.
#
# herdr.dev/install.sh is deliberately not piped to sh: it resolves the same
# manifest this task reads, but unconditionally re-downloads and cannot report
# "changed" to ansible. Reading latest.json directly keeps the task idempotent
# and lets `herdr update` (which uses the same manifest) stay the upgrade path.
- name: Check if herdr is already installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/bin/herdr"
  register: herdr_exists
  become: false
  when: not is_termux

# The binary reports "herdr X.Y.Z"; an empty string when absent keeps the
# version comparison below total rather than conditional on two facts.
- name: Get installed herdr version
  ansible.builtin.command:
    cmd: "{{ user_home }}/.local/bin/herdr --version"
  register: herdr_installed_version
  changed_when: false
  failed_when: false
  become: false
  when: not is_termux and herdr_exists.stat.exists

# The manifest keys assets by "<os>-<arch>" using its own arch spelling, which
# differs from ansible's on arm (aarch64 vs arm64 across distros).
- name: Resolve herdr release target and installed version
  ansible.builtin.set_fact:
    herdr_target: >-
      linux-{{ 'aarch64'
               if ansible_facts['architecture'] in ['aarch64', 'arm64']
               else 'x86_64' }}
    herdr_current: >-
      {{ (herdr_installed_version.stdout | default('') | regex_search('([0-9]+\.[0-9]+\.[0-9]+)', '\1') | first)
         if (herdr_installed_version.stdout | default('')) else '' }}
  become: false
  when: not is_termux

# Downloaded to a file and parsed with a filter rather than fetched with
# `uri: return_content: true`. The manifest embeds release notes for every
# version -- 155 KB, of which the three values below are under 1 KB -- and
# registering that whole structure makes ansible re-template it on each later
# reference. Doing so was enough to have the runner kill the play outright, with
# no ansible error to show for it.
#
# check_mode: false on both tasks because they only read: without it a --check
# run skips them and everything below fails on an undefined variable.
- name: Download the herdr release manifest
  ansible.builtin.get_url:
    url: https://herdr.dev/latest.json
    dest: /tmp/herdr-latest.json
    mode: "0644"
    force: true
  register: herdr_manifest_download
  until: herdr_manifest_download is succeeded
  retries: 3
  delay: 5
  become: false
  check_mode: false
  when: not is_termux

# Plain Jinja rather than json_query, which needs the jmespath library this repo
# does not install. The intermediate is scoped to this task's vars, so only the
# three extracted values enter the play's variables.
- name: Read the herdr version and this platform's asset from the manifest
  vars:
    herdr_manifest_json: "{{ lookup('file', '/tmp/herdr-latest.json') | from_json }}"
  ansible.builtin.set_fact:
    herdr_latest:
      version: "{{ herdr_manifest_json.version }}"
      url: "{{ herdr_manifest_json.assets[herdr_target] | default('') }}"
      sha256: "{{ herdr_manifest_json.sha256[herdr_target] | default('') }}"
  become: false
  check_mode: false
  when: not is_termux

- name: Fail when the manifest has no build for this platform
  ansible.builtin.fail:
    msg: "herdr publishes no binary for {{ herdr_target }}"
  when: not is_termux and not herdr_latest.url
  become: false

# get_url verifies the digest and skips the download when the destination
# already matches it, so a re-run of an up-to-date install is a no-op.
- name: Download herdr
  ansible.builtin.get_url:
    url: "{{ herdr_latest.url }}"
    dest: "{{ user_home }}/.local/bin/herdr"
    checksum: "sha256:{{ herdr_latest.sha256 }}"
    mode: "0755"
  become: false
  when: not is_termux and herdr_current != herdr_latest.version

# herdr's pi integration is the extension that reports agent lifecycle state to
# the sidebar. It is herdr-owned and overwritten on reinstall, which is why this
# repo's own herdr extension is a separate file beside it.
#
# `integration install` prints the same "installed ..." line whether or not the
# file was already current, so its output cannot drive changed_when. Gate on
# `integration status` instead, which reports per-target "current" vs
# "not installed" and also goes stale when a herdr upgrade bumps the
# integration version.
# Not gated on the earlier stat: the download task above has installed herdr by
# now, so on a fresh machine the binary exists even though the stat said it did
# not. Gating on that stale fact left herdr_integration_status unregistered and
# the next task's `when` failed on its missing stdout_lines.
- name: Check herdr pi integration status
  ansible.builtin.command:
    cmd: "{{ user_home }}/.local/bin/herdr integration status"
  register: herdr_integration_status
  changed_when: false
  become: false
  check_mode: false
  when: not is_termux

- name: Install herdr's pi integration
  ansible.builtin.command:
    cmd: "{{ user_home }}/.local/bin/herdr integration install pi"
  become: false
  # Folded scalar because the regex contains ": ", which YAML would otherwise
  # read as a mapping inside a plain multi-line scalar.
  when:
    - not is_termux
    # `default([])` because a --check run skips the status command above, which
    # leaves the registered result a bare skip dict with no stdout_lines.
    - >-
      herdr_integration_status.stdout_lines | default([])
      | select('match', '^pi: current') | list | length == 0

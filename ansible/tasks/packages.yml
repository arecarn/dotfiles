---
- name: Install common packages
  ansible.builtin.package:
    name: "{{ pkg_name }}"
    state: present
  loop: "{{ common_packages }}"
  tags:
    - packages
    - common
  vars:
    # Map package names if they differ significantly or should be skipped
    # Debian/Ubuntu package is 'bat' in both cases; only the installed binary
    # is renamed 'batcat' there (upstream naming clash with a preexisting
    # unrelated 'bat' package) — that's a shell-alias concern, not a package
    # name difference.
    pkg_name: >-
      {% if item == 'fd-find' %}
        {{ is_termux | ternary('fd', 'fd-find') }}
      {% else %}
        {{ item }}
      {% endif %}
  when: >-
    (item != 'xclip' or not is_termux) and
    (item != 'openssh-server' or not is_termux)
  ignore_errors: true

- name: Install OS-family-specific packages
  ansible.builtin.package:
    name: "{{ os_family_packages[ansible_facts['os_family']] }}"
    state: present
  tags:
    - packages
    - os-specific
  when: ansible_facts['os_family'] in os_family_packages

- name: Install GUI packages
  ansible.builtin.package:
    name: "{{ gui_packages[ansible_facts['os_family']] }}"
    state: present
  tags:
    - packages
    - gui
  when: >-
    ansible_facts['os_family'] in gui_packages and
    gui_packages[ansible_facts['os_family']] | length > 0

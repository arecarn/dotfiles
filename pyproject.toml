[project]
name = "dotfiles"
version = "0.0.0"
description = ""
authors = [{ name = "Ryan Carney", email = "arecarn@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "invoke>=2.2",
    "dploy>=0.1.3",
    "ruamel.yaml>=0.18",
    "ansible>=9.0; sys_platform != 'win32'",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]  # E/F = flake8, I = isort
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # fixture modules import symbols only for type context

[tool.pylint."messages control"]
disable = [
    "locally-disabled",
    "missing-function-docstring",  # test names are the documentation
    "unspecified-encoding",        # repo scripts run on machines with a consistent locale
    "use-implicit-booleaness-not-comparison",  # `== []` reads clearer than `not x` for drift lists
    "unused-import",               # pytest fixture modules import symbols only for type context
]

[tool.pylint.reports]
output-format = "colorized"
reports = false

[dependency-groups]
dev = [
    "pylint>=3.3",
    "pytest>=8.0",
    "ruff>=0.9",
    "yamllint>=1.35",
]
